name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system -e ".[dev,dbt]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -m "not integration" --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  dags:
    name: Airflow DAGs import cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Airflow with constraints
        run: |
          AIRFLOW_VERSION=$(grep -oP 'AIRFLOW_VERSION:-\K[0-9.]+' docker-compose.yml || echo "3.0.2")
          CONSTRAINT="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${{ env.PYTHON_VERSION }}.txt"
          uv pip install --system "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT}"
          uv pip install --system -e .

      - name: Import every DAG
        env:
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          python - <<'PY'
          import sys
          from airflow.models import DagBag

          bag = DagBag(dag_folder="dags", include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f"::error file={path}::{err}")
              sys.exit(1)
          print(f"{len(bag.dags)} DAG(s) imported cleanly: {sorted(bag.dags)}")
          PY

  dbt:
    name: dbt parses and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}

      - run: uv pip install --system -e ".[dbt]"

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt parse
        working-directory: dbt
        run: dbt parse

      # Seeds must load before models run. A source() has no DAG edge to a
      # seed, so a single `dbt build` races and the staging model can't find
      # its table. Two steps, deterministic order.
      - name: dbt seed
        working-directory: dbt
        run: dbt seed --target ci

      - name: dbt build
        working-directory: dbt
        run: dbt build --target ci --exclude "resource_type:seed"

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
