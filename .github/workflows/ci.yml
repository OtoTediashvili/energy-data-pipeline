name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.23.3"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # A venv, not --system: Ubuntu's system Python is PEP 668
      # externally-managed, so installing into it is refused. Appending to
      # GITHUB_PATH keeps the venv active for every later step in the job.
      - name: Create virtualenv
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv pip install -e ".[dev,dbt]"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -m "not integration" --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  dags:
    name: Airflow DAGs import cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtualenv
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Airflow pins its transitive dependencies hard, so it is installed
      # against the official constraints file, separate from the analytics stack.
      - name: Install Airflow with constraints
        run: |
          AIRFLOW_VERSION=$(grep -oP 'AIRFLOW_VERSION:-\K[0-9.]+' docker-compose.yml || echo "3.0.2")
          CONSTRAINT="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${{ env.PYTHON_VERSION }}.txt"
          uv pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT}"
          uv pip install -e .

      - name: Import every DAG
        env:
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          python - <<'PY'
          import sys
          from airflow.models import DagBag

          bag = DagBag(dag_folder="dags", include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f"::error file={path}::{err}")
              sys.exit(1)
          print(f"{len(bag.dags)} DAG(s) imported cleanly: {sorted(bag.dags)}")
          PY

  dbt:
    name: dbt parses and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtualenv
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv pip install -e ".[dbt]"

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt parse
        working-directory: dbt
        run: dbt parse

      # Seeds must load before models run. A source() has no DAG edge to a
      # seed, so a single `dbt build` races. Two steps, deterministic order.
      - name: dbt seed
        working-directory: dbt
        run: dbt seed --target ci

      - name: dbt build
        working-directory: dbt
        run: dbt build --target ci --exclude "resource_type:seed"

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history: a secret deleted later is still leaked

      # The gitleaks binary rather than gitleaks-action. The action scans a
      # push-event commit range, which breaks with "unknown revision" after a
      # force-push rewrites history. Scanning the whole history directly is
      # deterministic and identical to running it locally.
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full git history
        run: gitleaks git . --redact --verbose --no-banner
