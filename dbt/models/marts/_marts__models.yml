version: 2

models:
  - name: dim_bidding_zone
    description: One row per bidding zone in the data, named from the reference seed.
    columns:
      - name: bidding_zone_sk
        description: Surrogate key.
        data_tests: [unique, not_null]
      - name: bidding_zone_eic
        data_tests: [unique, not_null]
      - name: bidding_zone_name
        data_tests: [not_null]

  - name: fct_daily_prices
    description: "Day-ahead prices per bidding zone per market day. Grain: one row per zone per market day."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [bidding_zone_sk, market_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "covered_minutes in (1380, 1440, 1500)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "min_price_eur_mwh <= avg_price_eur_mwh and avg_price_eur_mwh <= max_price_eur_mwh"
    columns:
      - name: bidding_zone_sk
        description: FK to dim_bidding_zone.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bidding_zone')
                field: bidding_zone_sk
      - name: market_date
        data_tests: [not_null]
      - name: covered_minutes
        description: >
          Minutes of the market day that carry a price: 1440 normally, 1380 or
          1500 on the days the clocks change. Anything else is a partial day.

unit_tests:
  - name: fct_rebuilds_every_day_that_received_data_since_the_last_build
    description: >
      The table was last built from data ingested up to 25 September 13:00.
      Since then a backfill delivered 1 October 2025, a year older than
      anything built here, and a correction arrived for one hour of
      20 September in the Netherlands. Both days are rebuilt, the corrected
      one from all of its intervals, not only the new one. 24 September and
      Belgium's 20 September received nothing new and are left alone.
    model: fct_daily_prices
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        format: sql
        rows: |
          select timestamp '2026-09-25 13:00:00' as last_ingested_at
      - input: ref('stg_day_ahead_prices')
        rows:
          - {bidding_zone: "10YNL----------L", market_date: "2025-10-01", price_eur_mwh: 50.0, resolution_minutes: 60, ingested_at: "2026-10-09 15:00:00"}
          - {bidding_zone: "10YNL----------L", market_date: "2026-09-20", price_eur_mwh: 60.0, resolution_minutes: 60, ingested_at: "2026-09-20 13:00:00"}
          - {bidding_zone: "10YNL----------L", market_date: "2026-09-20", price_eur_mwh: 70.0, resolution_minutes: 60, ingested_at: "2026-09-26 13:00:00"}
          - {bidding_zone: "10YBE----------2", market_date: "2026-09-20", price_eur_mwh: 65.0, resolution_minutes: 60, ingested_at: "2026-09-20 13:00:00"}
          - {bidding_zone: "10YNL----------L", market_date: "2026-09-24", price_eur_mwh: 80.0, resolution_minutes: 60, ingested_at: "2026-09-24 13:00:00"}
      - input: ref('dim_bidding_zone')
        rows:
          - {bidding_zone_sk: "nl", bidding_zone_eic: "10YNL----------L"}
          - {bidding_zone_sk: "be", bidding_zone_eic: "10YBE----------2"}
    expect:
      rows:
        - {bidding_zone_sk: "nl", market_date: "2025-10-01", interval_count: 1, avg_price_eur_mwh: 50.0}
        - {bidding_zone_sk: "nl", market_date: "2026-09-20", interval_count: 2, avg_price_eur_mwh: 65.0}
