version: 2

models:
  - name: stg_day_ahead_prices
    description: >
      One row per bidding zone per market time unit of the main day-ahead
      auction: the highest revision, then the latest ingestion, of every
      delivery raw received. A second auction (EXAA for Austria) stays in raw.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [bidding_zone, interval_start_utc]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "interval_end_utc > interval_start_utc"
    columns:
      - name: bidding_zone
        description: ENTSO-E EIC code of the bidding zone.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('bidding_zones')
                field: bidding_zone_eic
              config:
                severity: warn
      - name: interval_start_utc
        data_tests: [not_null]
      - name: interval_end_utc
        data_tests: [not_null]
      - name: market_date
        description: Delivery day in market time (CET/CEST), which is how the auction defines a day.
        data_tests: [not_null]
      - name: resolution_minutes
        data_tests:
          - accepted_values:
              arguments:
                values: [15, 30, 60]
                quote: false
      - name: price_eur_mwh
        data_tests: [not_null]
      - name: currency
        description: Guards the column names. Every price column promises EUR.
        data_tests:
          - accepted_values:
              arguments:
                values: ["EUR"]
      - name: price_unit
        data_tests:
          - accepted_values:
              arguments:
                values: ["MWH"]
      - name: revision_number
        data_tests: [not_null]

unit_tests:
  - name: stg_keeps_newest_revision_and_collapses_overlapping_deliveries
    description: >
      Three deliveries of one quarter-hour: revision 1 from Thursday's run, the
      same revision again from Friday's overlapping run, and a corrected
      revision 2. Exactly one row survives, carrying the corrected price.
    model: stg_day_ahead_prices
    given:
      - input: source('raw', 'day_ahead_prices')
        rows:
          - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-09-24 22:00:00+00", price_eur_mwh: 100.0, revision_number: 1, _ingested_at: "2026-09-24 03:00:00", _logical_date: "2026-09-24"}
          - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-09-24 22:00:00+00", price_eur_mwh: 100.0, revision_number: 1, _ingested_at: "2026-09-25 03:00:00", _logical_date: "2026-09-25"}
          - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-09-24 22:00:00+00", price_eur_mwh: 90.0, revision_number: 2, _ingested_at: "2026-09-25 03:00:00", _logical_date: "2026-09-25"}
    expect:
      rows:
        - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-09-24 22:00:00+00", price_eur_mwh: 90.0, revision_number: 2}

  - name: stg_assigns_market_days_in_cet_summer_and_winter
    description: >
      Market days follow Brussels wall-clock time. In September (CEST, UTC+2)
      21:45 UTC is still the 24th and 22:00 UTC starts the 25th. In January
      (CET, UTC+1) the boundary moves to 23:00 UTC. A fixed offset passes one
      season and silently misassigns the other. Zones at the same instant stay
      separate rows.
    model: stg_day_ahead_prices
    given:
      - input: source('raw', 'day_ahead_prices')
        rows:
          - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-09-24 21:45:00+00", revision_number: 1}
          - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-09-24 22:00:00+00", revision_number: 1}
          - {bidding_zone: "10YBE----------2", interval_start_utc: "2026-09-24 22:00:00+00", revision_number: 1}
          - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-01-14 22:00:00+00", revision_number: 1}
          - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-01-14 23:00:00+00", revision_number: 1}
    expect:
      rows:
        - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-09-24 21:45:00+00", market_date: "2026-09-24"}
        - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-09-24 22:00:00+00", market_date: "2026-09-25"}
        - {bidding_zone: "10YBE----------2", interval_start_utc: "2026-09-24 22:00:00+00", market_date: "2026-09-25"}
        - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-01-14 22:00:00+00", market_date: "2026-01-14"}
        - {bidding_zone: "10YNL----------L", interval_start_utc: "2026-01-14 23:00:00+00", market_date: "2026-01-15"}

  - name: stg_keeps_only_the_main_auction
    description: >
      Austria's deliveries price the same quarter-hours twice: the main
      European auction (sequence 1) and EXAA's (sequence 2). Staging keeps the
      main auction even where EXAA's row carries a higher revision, so the
      auction is chosen before deliveries are ranked. A zone with one auction
      has no sequence and is kept as it is.
    model: stg_day_ahead_prices
    given:
      - input: source('raw', 'day_ahead_prices')
        rows:
          - {bidding_zone: "10YAT-APG------L", interval_start_utc: "2025-09-30 22:00:00+00", price_eur_mwh: 100.0, revision_number: 1, auction_sequence: 1}
          - {bidding_zone: "10YAT-APG------L", interval_start_utc: "2025-09-30 22:00:00+00", price_eur_mwh: 300.0, revision_number: 1, auction_sequence: 2}
          - {bidding_zone: "10YAT-APG------L", interval_start_utc: "2025-09-30 22:15:00+00", price_eur_mwh: 101.0, revision_number: 1, auction_sequence: 1}
          - {bidding_zone: "10YAT-APG------L", interval_start_utc: "2025-09-30 22:15:00+00", price_eur_mwh: 301.0, revision_number: 2, auction_sequence: 2}
          - {bidding_zone: "10YNL----------L", interval_start_utc: "2025-09-30 22:00:00+00", price_eur_mwh: 90.0, revision_number: 1}
    expect:
      rows:
        - {bidding_zone: "10YAT-APG------L", interval_start_utc: "2025-09-30 22:00:00+00", price_eur_mwh: 100.0}
        - {bidding_zone: "10YAT-APG------L", interval_start_utc: "2025-09-30 22:15:00+00", price_eur_mwh: 101.0}
        - {bidding_zone: "10YNL----------L", interval_start_utc: "2025-09-30 22:00:00+00", price_eur_mwh: 90.0}
