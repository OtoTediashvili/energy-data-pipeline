version: 2

models:
  - name: stg_prices
    description: Cleaned, deduplicated price observations. One row per id per date.
    columns:
      - name: price_id
        description: Unique identifier from the source.
        data_tests: [not_null]
      - name: country_code
        description: ISO 3166-1 alpha-2 country code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["GE", "DE", "FR", "IT", "ES", "PL"]
      - name: price_eur_mwh
        description: Price in EUR per MWh. Nullable, the source omits unpriced hours.
      - name: observed_date
        description: The date the observation belongs to.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [price_id, observed_date]
