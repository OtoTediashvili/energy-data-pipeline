version: 2

sources:
  - name: raw
    description: Loaded by pipeline.load. dbt reads these tables and never writes them.
    schema: raw
    tables:
      - name: day_ahead_prices
        description: >
          One row per market time unit per delivery. A delivery log, not a
          deduplicated table: overlapping runs and republished revisions both
          add rows. CI reads the sample seed instead of the live table, so no
          `dbt seed` can ever overwrite real data.
        identifier: "{{ 'day_ahead_prices_sample' if target.name == 'ci' else 'day_ahead_prices' }}"
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: {count: 36, period: hour}
            error_after: {count: 72, period: hour}
