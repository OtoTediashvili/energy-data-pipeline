version: 2

sources:
  - name: raw
    description: Landed source data, loaded by pipeline.load. Never edited by dbt.
    schema: raw
    tables:
      - name: prices
        description: One row per observation as received from the source API.
        columns:
          - name: id
            description: Source-assigned identifier.
          - name: _logical_date
            description: Partition key. The interval this row belongs to.
          - name: _ingested_at
            description: When our loader wrote it. Used to resolve revisions.
