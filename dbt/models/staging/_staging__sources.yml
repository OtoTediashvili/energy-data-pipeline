version: 2

sources:
  - name: raw
    description: Loaded by pipeline.load. dbt reads these tables and never writes them.
    schema: raw
    tables:
      - name: day_ahead_prices
        description: >
          One row per market time unit per delivery. A delivery log, not a
          deduplicated table: overlapping runs and republished revisions both
          add rows. CI reads the sample seed instead of the live table, so no
          `dbt seed` can ever overwrite real data.
        identifier: "{{ 'day_ahead_prices_sample' if target.name == 'ci' else 'day_ahead_prices' }}"
        data_tests:
          # Within one delivery an auction prices each interval once. A second
          # price would leave staging nothing deterministic to choose between.
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  [_source_file, bidding_zone, auction_sequence, interval_start_utc]
        columns:
          - name: auction_sequence
            description: >
              Which day-ahead auction a row belongs to: 1 is the main European
              auction (SDAC), 2 a second one (EXAA, for Austria). Empty for
              zones with a single auction.
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: {count: 36, period: hour}
            error_after: {count: 72, period: hour}
