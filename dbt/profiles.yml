warehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "../data/warehouse/warehouse.duckdb"
      schema: main
      threads: 4

    ci:
      type: duckdb
      path: "ci.duckdb"
      schema: main
      threads: 4

    prod:
      type: duckdb
      # The variable the Python loader reads, so dbt and the pipeline can never
      # point at different files.
      path: "{{ env_var('PIPELINE_DUCKDB_PATH', '/opt/airflow/data/warehouse/warehouse.duckdb') }}"
      schema: main
      threads: 4
