# Local Airflow 3 stack: Postgres metadata DB + LocalExecutor.
#
# Deliberately slimmer than the official compose file — no Redis, no Celery,
# no Flower. LocalExecutor handles far more than a portfolio project needs and
# removes two moving parts. Swap to CeleryExecutor only if you have a reason.
#
#   make up        -> http://localhost:8081, user admin; builds the image first
#   make password  -> the admin password
#   make down

x-airflow-common: &airflow-common
  # Airflow plus the pipeline's dependencies and a separate dbt virtualenv.
  # See Dockerfile. Every Airflow service shares this one image.
  build:
    context: .
    args:
      AIRFLOW_VERSION: ${AIRFLOW_VERSION:-3.0.2}
  image: energy-pipeline-airflow:${AIRFLOW_VERSION:-3.0.2}
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-local-dev-secret-change-me}
    # Airflow 3 tasks report to the API server over HTTP. Left unset, the address
    # defaults to localhost:8080, which inside the scheduler container is the
    # scheduler itself, so every task failed before it could start. Airflow's
    # own compose file sets the same value.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    # Make src/ importable inside the containers
    PYTHONPATH: /opt/airflow/src
    # Pipeline settings, read by pipeline.config.Settings
    # Airflow 3's SimpleAuthManager generates the admin password on first start
    # and reuses it from this file afterwards. Kept in the mounted, gitignored
    # config/ folder so it survives `make down` and you can read it from the host.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
    PIPELINE_ENV: local
    PIPELINE_LOG_JSON: "true"
    PIPELINE_DATA_DIR: /opt/airflow/data
    PIPELINE_DUCKDB_PATH: /opt/airflow/data/warehouse/warehouse.duckdb
    PIPELINE_SOURCE_BASE_URL: ${PIPELINE_SOURCE_BASE_URL:-https://web-api.tp.entsoe.eu/api}
    PIPELINE_SOURCE_API_KEY: ${PIPELINE_SOURCE_API_KEY:-}
    # dbt runs from its own virtualenv inside the image; the DAG reads these.
    DBT_BIN: /opt/dbt-venv/bin/dbt
    DBT_PROJECT_DIR: /opt/airflow/dbt
    DBT_TARGET: prod
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    # Through the image's own entrypoint, never around it. The containers run as
    # your user id, which the image's /etc/passwd doesn't know, and Airflow
    # refuses to run as a user with no name. The entrypoint registers the id,
    # waits for the database, then runs `airflow db migrate`.
    # (Airflow 3 has no `airflow users` command: the API server creates the
    # admin user and password itself; see the passwords file setting above.)
    command: db migrate
    depends_on:
      postgres:
        condition: service_healthy
    # A one-shot job: if it fails, stop and say so. With on-failure, Docker
    # retried it forever and `make up` waited forever behind it.
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      # Localhost only: the UI and API must not be reachable from your network.
      - "127.0.0.1:${AIRFLOW_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
